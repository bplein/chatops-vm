# kubectl apply -f deploy/k8s/chatops-vm-rbac.yaml
# kubectl apply -f deploy/k8s/chatops-vm.yaml
# No shared credentials: users authenticate with their own AI-client credential per
# session (Claude/Gemini API key in memory, or Codex device sign-in), and their own
# vCenter password. The web pod talks only to the Kubernetes API to spin up session pods.
# Image is public on ghcr.io/bplein/chatops-vm — no pull secret needed.
apiVersion: v1
kind: Namespace
metadata: {name: chatops-vm}
---
apiVersion: v1
kind: Service
metadata: {name: chatops-vm, namespace: chatops-vm}
spec:
  selector: {app: chatops-vm}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: chatops-vm
  namespace: chatops-vm
  annotations:
    # Web tier scales to 2+ replicas; sessions (SDK clients, stream callbacks) are
    # stuck to whichever pod served the login. Router-managed cookie affinity pins them.
    haproxy.router.openshift.io/cookie_name: aiops-session
    haproxy.router.openshift.io/balance: roundrobin
spec:
  host: chatops-vm-chatops-vm.apps.ocp1.plein.cna.lab
  to: {kind: Service, name: chatops-vm}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: chatops-vm, namespace: chatops-vm}
spec:
  replicas: 2                  # stickiness (Route cookie_name) keeps each session on one pod
  strategy: {type: Recreate}   # sessions live in RAM; in-place updates would drop them mid-stream
  selector: {matchLabels: {app: chatops-vm}}
  template:
    metadata: {labels: {app: chatops-vm}}
    spec:
      # app/controller.py talks to the Kubernetes API to create/drive per-session
      # agent pods, so the web pod needs an identity RBAC can grant rights to.
      # Rights come from chatops-vm-rbac.yaml (apply that first). The mounted
      # token is what load_incluster_config() reads, hence automount true here;
      # session pods themselves stay automountServiceAccountToken: false.
      # The web tier is multi-replica: the controller keeps no per-pod state, all
      # session/cap accounting goes through the API.
      serviceAccountName: aiops-web
      automountServiceAccountToken: true
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          # Pinned tag — bump with VERSION on release; never :latest.
          image: ghcr.io/bplein/chatops-vm:0.3.7
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: MAX_SESSION_PODS   # global (namespace-wide) cap on agent pods
              value: "10"
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 30}
          # NOTE: claude CLI + node write to HOME and /tmp; RO rootfs deferred.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
